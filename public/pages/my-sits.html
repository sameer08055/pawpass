<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Sits — PawPass</title>
    <meta name="author" content="Sree Rachnae Shyam" />
    <meta name="description" content="Manage your booked pet-sitting jobs on PawPass." />
    <link rel="stylesheet" href="../css/sitter-profile.css" />
    <link rel="stylesheet" href="../css/sits.css" />
  </head>
  <body>
    <nav class="site-nav">
      <a href="../index.html" class="site-nav__brand">PawPass</a>
      <ul class="site-nav__links">
        <li><a href="my-sitter-profile.html">My Sitter Profile</a></li>
        <li><a href="my-sits.html">My Sits</a></li>
      </ul>
    </nav>

    <main class="container">
      <h1>My Sits</h1>

      <section>
        <h2 id="bookingFormHeading">Log a New Sit</h2>
        <form id="bookingForm">
          <label for="petName">Pet name</label>
          <input type="text" id="petName" name="petName" required />

          <label for="ownerContact">Owner contact</label>
          <input
            type="text"
            id="ownerContact"
            name="ownerContact"
            placeholder="email or phone"
          />

          <label for="quickFactsLink">Quick Facts link</label>
          <input
            type="url"
            id="quickFactsLink"
            name="quickFactsLink"
            placeholder="https://..."
          />

          <div class="field-row">
            <div>
              <label for="startDate">Start date</label>
              <input type="date" id="startDate" name="startDate" required />
            </div>
            <div>
              <label for="endDate">End date</label>
              <input type="date" id="endDate" name="endDate" required />
            </div>
          </div>

          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="2"></textarea>

          <button type="submit" id="bookingFormSubmitBtn">Log Sit</button>
          <button type="button" id="cancelEditBtn" class="secondary-btn hidden">
            Cancel
          </button>
        </form>
        <p id="bookingsStatus" class="status-message" role="status"></p>
      </section>

      <section>
        <h2>My Sits</h2>
        <ul id="bookingsList" class="bookings-list"></ul>
      </section>
    </main>

    <script type="module" src="../js/bookings/mySitsPage.js"></script>
  </body>
</html>
